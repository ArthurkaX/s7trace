<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">Manual troubleshooting workflow before s7trace</title>
  <desc id="desc">The engineer's manual tasks are shown across the top. Along the bottom, runtime data moves in one uninterrupted row from the S7 PLC through Telegraf and InfluxDB to Grafana.</desc>

  <defs>
    <marker id="manual-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b5523a"/>
    </marker>
    <marker id="data-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .eyebrow { font: 600 10px Consolas, 'Courier New', monospace; letter-spacing: 1.4px; fill: #78716c; }
      .name { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #1c1917; }
      .sub { font: 400 11px Consolas, 'Courier New', monospace; fill: #57534e; }
      .manual-label { font: 600 11px Consolas, 'Courier New', monospace; fill: #b5523a; }
      .data-label { font: 600 11px Consolas, 'Courier New', monospace; fill: #2563eb; }
      .node { fill: #fff; stroke: #1c1917; stroke-width: 1.2; }
      .external { fill: rgba(28,25,23,.035); stroke: rgba(28,25,23,.38); stroke-width: 1; }
      .human { fill: rgba(181,82,58,.08); stroke: #b5523a; stroke-width: 1.6; }
      .task { fill: #faf7f2; stroke: rgba(181,82,58,.55); stroke-width: 1; }
      .store { fill: rgba(28,25,23,.05); stroke: #57534e; stroke-width: 1.2; }
      .manual { fill: none; stroke: #b5523a; stroke-width: 1.4; marker-end: url(#manual-arrow); }
      .data { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#data-arrow); }
      .rule { stroke: rgba(120,113,108,.25); stroke-width: 1; }
      .mask { fill: #faf7f2; }
    </style>
  </defs>

  <rect width="1040" height="420" fill="#faf7f2"/>
  <text x="32" y="28" class="eyebrow">BEFORE S7TRACE</text>

  <!-- Top: the engineer and the manual work -->
  <rect x="32" y="60" width="176" height="112" rx="8" class="human"/>
  <text x="56" y="88" class="eyebrow">MANUAL WORK</text>
  <text x="56" y="120" class="name">Controls engineer</text>
  <text x="56" y="146" class="sub">every setup decision</text>

  <path d="M208 116 L244 116" class="manual"/>

  <rect x="248" y="72" width="152" height="88" rx="6" class="task"/>
  <text x="272" y="104" class="manual-label">1 · READ STEP 7</text>
  <text x="272" y="132" class="sub">code · symbols · DBs</text>

  <rect x="448" y="72" width="152" height="88" rx="6" class="task"/>
  <text x="472" y="104" class="manual-label">2 · WRITE CONFIG</text>
  <text x="472" y="132" class="sub">addresses · types</text>

  <rect x="648" y="72" width="160" height="88" rx="6" class="task"/>
  <text x="672" y="104" class="manual-label">3 · BUILD CHARTS</text>
  <text x="672" y="132" class="sub">queries · panels</text>

  <rect x="856" y="72" width="152" height="88" rx="6" class="task"/>
  <text x="880" y="104" class="manual-label">4 · INVESTIGATE</text>
  <text x="880" y="132" class="sub">inspect by hand</text>

  <!-- Simple vertical associations: manual work affects the components below -->
  <path d="M524 160 L524 192 L364 192 L364 248" class="manual"/>
  <path d="M728 160 L728 192 L892 192 L892 248" class="manual"/>
  <path d="M932 160 L932 248" class="manual"/>

  <line x1="32" y1="216" x2="1008" y2="216" class="rule"/>
  <text x="32" y="240" class="eyebrow">RUNTIME DATA — ONE CONTINUOUS PATH</text>

  <!-- Bottom: the only data pipeline -->
  <rect x="32" y="264" width="168" height="96" rx="6" class="external"/>
  <text x="88" y="302" class="name">S7 PLC</text>
  <text x="80" y="330" class="sub">live values</text>

  <rect x="280" y="264" width="168" height="96" rx="6" class="node"/>
  <text x="328" y="302" class="name">Telegraf</text>
  <text x="326" y="330" class="sub">collector</text>

  <path d="M528 280 C528 264 696 264 696 280 L696 344 C696 360 528 360 528 344 Z" class="store"/>
  <ellipse cx="612" cy="280" rx="84" ry="16" class="store"/>
  <text x="570" y="314" class="name">InfluxDB</text>
  <text x="574" y="340" class="sub">time-series</text>

  <rect x="776" y="264" width="232" height="96" rx="6" class="node"/>
  <text x="860" y="302" class="name">Grafana</text>
  <text x="836" y="330" class="sub">queries · charts</text>

  <path d="M200 312 L280 312" class="data"/>
  <rect x="220" y="292" width="44" height="18" class="mask"/>
  <text x="224" y="305" class="data-label">poll</text>

  <path d="M448 312 L528 312" class="data"/>
  <rect x="468" y="292" width="48" height="18" class="mask"/>
  <text x="472" y="305" class="data-label">write</text>

  <path d="M696 312 L776 312" class="data"/>
  <rect x="716" y="292" width="48" height="18" class="mask"/>
  <text x="720" y="305" class="data-label">query</text>

  <text x="32" y="400" class="sub">The data path was automatic. Preparing it—and interpreting every chart—was not.</text>
</svg>
