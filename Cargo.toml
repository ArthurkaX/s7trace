[package]
name = "s7trace"
version = "0.1.0"
edition = "2021"
description = "Read-only troubleshooting recorder for Siemens S7-300/400 PLCs"
repository = "https://github.com/ArthurkaX/s7trace"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
regex = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
rust7 = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# turbos7 is available on crates.io (the GitHub link in its metadata is dead,
# which is a yellow flag, but the crate is published and downloadable).
turbos7 = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
axum = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[patch.crates-io]
turbos7 = { path = "vendor/turbos7" }
